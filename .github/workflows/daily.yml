name: 发布站点

# 采集与 AI 研判全部在本机完成；这里只负责把 site/ 的内容发布到 GitHub Pages。
# 原来的每日 cron 已移除——云端没有本地模型，跑起来会用无 AI 的内容覆盖页面。

on:
  workflow_dispatch:      # 需要时可手动点一下重新发布
  push:
    branches: [ main ]
    paths:
      - "site/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: worldpulse-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
