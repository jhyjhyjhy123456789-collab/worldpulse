name: 世界脉搏 每日简报

on:
  # 每天 08:00 北京时间（UTC 00:00）。GitHub 的定时任务可能延迟几分钟到半小时。
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:      # 支持在 Actions 页面手动点一下立即跑
  push:
    branches: [ main ]
    paths:
      - "pulse.py"
      - "config.cloud.json"
      - ".github/workflows/daily.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: worldpulse
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 云端配置（境外源在 GitHub 机器上可直连，不需要代理）
        run: cp config.cloud.json config.json

      - name: 回填站点地址（供推送正文里的链接使用）
        run: python tools/set_public_url.py

      - name: 采集 + 生成报告
        run: python pulse.py run --verbose

      - name: 提交报告与数据库（保留历史，趋势对比要用）
        run: |
          git config user.name "worldpulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site data/monitor.db
          if git diff --staged --quiet; then
            echo "没有变化"
          else
            git commit -m "简报 $(date +%Y-%m-%d)"
            git push
          fi

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
